{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>New Project — Coding Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
:root{
  --sky:#eef6ff;--sky2:#d0e8fa;--navy:#1a3a6b;--gold:#ffc107;--gold2:#ffd740;
  --ink:#1a2638;--ink3:#7088a0;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Nunito',sans-serif;
  background:linear-gradient(135deg,#eef6ff 0%,#d0e8fa 100%);
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:20px;color:var(--ink);
}
.card{
  background:#fff;border-radius:24px;padding:36px 32px;
  width:100%;max-width:460px;
  box-shadow:0 8px 40px rgba(26,58,107,.18);
  border:1px solid var(--sky2);
}
.icon-wrap{
  width:64px;height:64px;border-radius:20px;background:var(--navy);
  display:flex;align-items:center;justify-content:center;
  margin-bottom:20px;
}
.icon-wrap i{font-size:28px;color:var(--gold)}
h1{font-family:'Fredoka One',cursive;font-size:24px;color:var(--navy);margin-bottom:6px}
.sub{font-size:13px;color:var(--ink3);margin-bottom:24px;line-height:1.5}
label{display:block;font-size:12px;font-weight:800;color:var(--ink3);
      letter-spacing:.5px;text-transform:uppercase;margin-bottom:8px}
input{
  width:100%;padding:14px 16px;border:1.5px solid var(--sky2);
  border-radius:12px;font-size:15px;font-family:inherit;
  transition:all .2s;color:var(--ink);
}
input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px rgba(255,193,7,.15)}
.row{display:flex;gap:10px;margin-top:20px}
button{
  flex:1;padding:14px;border-radius:12px;font-family:inherit;
  font-weight:800;font-size:14px;cursor:pointer;
  border:none;transition:all .2s;
}
.btn-primary{background:var(--gold);color:var(--navy)}
.btn-primary:hover{background:var(--gold2);transform:translateY(-1px);
                   box-shadow:0 4px 14px rgba(255,193,7,.4)}
.btn-cancel{background:var(--sky);color:var(--ink3);flex:0 0 auto;padding:14px 22px}
.btn-cancel:hover{background:var(--sky2)}
.hint{font-size:11px;color:var(--ink3);margin-top:12px;text-align:center}
</style>
</head>
<body>

<form class="card" method="POST" action="{% url 'dojo:developer_project_new' %}" autocomplete="off">
  {% csrf_token %}
  <div class="icon-wrap"><i class="fas fa-rocket"></i></div>
  <h1>Name your project</h1>
  <p class="sub">Give it something memorable — you can rename it later from the editor.</p>

  <label for="title">Project name</label>
  <input id="title" name="title" type="text" maxlength="150"
         placeholder="e.g. My Portfolio Site"
         autofocus required>

  <div class="row">
    <button type="button" class="btn-cancel" onclick="history.back()">Cancel</button>
    <button type="submit" class="btn-primary">
      <i class="fas fa-arrow-right"></i> Create Project
    </button>
  </div>

  <p class="hint">You'll start with index.html, style.css, and app.js</p>
</form>

</body>
</html>
